epics:
  - id: EXPL
    title: Tableau de bord d'exploration des films sur plusieurs années
    objective: Construire une chaîne de données reproductible, de la collecte TMDB au tableau de bord, pour comparer les films selon leur année de sortie sur une période configurable.
    tickets:
      - id: EXPL-01
        type: feature
        title: "Spécification : données et relations du catalogue d'exploration"
        story: |
          En tant qu'étudiant, je dispose de la spécification fonctionnelle des données
          pour réaliser le schéma de la base dans EXPL-02, sans devoir redéfinir le modèle.

          ### Référence et périmètre

          Cette spécification reprend le modèle déjà réalisé dans le worktree
          `alexandre-girard-maif-ubiquitous-meme`, décrit dans la section
          « Base de données » du README et dans `src/back-end/database/schema.ts`.
          Elle est autonome : l'étudiant n'a pas besoin d'accéder à ce worktree.
          La cible est SQLite, avec cinq tables décrites ci-dessous.

          Les films sont collectés depuis TMDB Discover sur une période inclusive
          configurable, par exemple 2015 à 2024, avec une limite par année et un tri
          par popularité documentés. Les détails TMDB enrichissent les films avec
          leur durée, leur budget, leurs recettes et leurs pays de production.
          Les genres sont identifiés par TMDB et leurs libellés sont récupérés en français.
          Les notes et la popularité sont celles observées lors de la collecte :
          elles ne reconstituent pas une évolution historique.

          ### Dictionnaire des films : movies

          | Attribut | Type SQLite | Obligatoire | Signification |
          | --- | --- | --- | --- |
          | id | INTEGER | Oui, clé primaire | Identifiant TMDB stable du film |
          | title | TEXT | Oui | Titre traduit |
          | original_title | TEXT | Oui | Titre original |
          | original_language | TEXT | Oui | Code de langue originale fourni par TMDB |
          | overview | TEXT | Oui | Résumé ; une chaîne vide est possible |
          | release_date | TEXT | Non | Date de sortie TMDB au format YYYY-MM-DD |
          | release_year | INTEGER généré, STORED | Non, calculé | Année extraite de release_date par SQLite ; jamais fournie par la collecte |
          | popularity | REAL | Non | Score TMDB au moment de la collecte |
          | vote_average | REAL | Non | Note moyenne sur 10 ; zéro reste une note possible |
          | vote_count | INTEGER | Non | Nombre de votes |
          | poster_path | TEXT | Non | Chemin relatif de l'affiche TMDB |
          | backdrop_path | TEXT | Non | Chemin relatif de l'image de fond TMDB |
          | runtime_minutes | INTEGER | Non | Durée strictement positive, en minutes |
          | budget | INTEGER | Non | Budget strictement positif, en dollars US |
          | revenue | INTEGER | Non | Recettes strictement positives, en dollars US |
          | collected_at | TEXT | Oui | Horodatage de la dernière collecte au format ISO 8601 |

          `release_year` est une colonne générée stockée, définie par :

          ```sql
          release_year INTEGER GENERATED ALWAYS AS (
            CAST(strftime('%Y', release_date) AS INTEGER)
          ) STORED
          ```

          SQLite la recalcule automatiquement lorsque `release_date` change.
          Les INSERT et UPDATE de la collecte ne doivent jamais renseigner
          `release_year`. L'année demandée sert uniquement à filtrer la collecte,
          pas à remplacer une année inconnue. Une date absente ou inexploitable
          donne une année NULL : le film reste dans le catalogue et les indicateurs
          globaux, mais est exclu des graphiques et regroupements par année.

          ### Référentiels et associations

          | Table | Attributs | Rôle |
          | --- | --- | --- |
          | genres | id INTEGER clé primaire ; name TEXT nullable | Genre TMDB et libellé français lorsqu'il est connu |
          | countries | code TEXT clé primaire ; name TEXT obligatoire | Pays de production, code ISO 3166-1 alpha-2 et libellé TMDB |
          | movie_genres | movie_id INTEGER ; genre_id INTEGER | Association film-genre, clé primaire composée des deux attributs |
          | production_countries | movie_id INTEGER ; country_code TEXT | Association film-pays, clé primaire composée des deux attributs |

          Un film possède zéro à plusieurs genres ; un genre concerne zéro à plusieurs
          films. Un film possède zéro à plusieurs pays de production ; un pays concerne
          zéro à plusieurs films. Les tables de liaison portent les clés étrangères
          vers `movies.id`, `genres.id` et `countries.code`. Les clés composées
          interdisent les associations en double. Un film sans genre ou pays connu
          reste stocké sans association : ne pas inventer de référence « Inconnu ».
          Supprimer un film supprime ses associations, mais conserve les référentiels.

          ### Valeurs absentes, actualisation et calculs

          Les durées, budgets et recettes absents ou égaux à zéro deviennent NULL ;
          une valeur renseignée doit être strictement positive. Popularité, note et
          nombre de votes absents restent NULL, sans remplacement par zéro.
          Un film contribue aux moyennes des notes uniquement si sa note est connue
          et son nombre de votes strictement positif. Une note de zéro avec des votes
          est valide. Une durée inconnue est exclue de la moyenne des durées.

          Chaque film est unique par identifiant TMDB. Une nouvelle collecte actualise
          ses attributs, son horodatage et ses associations dans une même transaction,
          sans supprimer les films des autres années. Le nombre de films se calcule
          sur les films distincts : les totaux par genre ou pays comptent des
          associations et peuvent dépasser ce nombre pour les coproductions.

          Le modèle de référence ne conserve ni table d'exécutions ni historique de
          notes : `collected_at` décrit le dernier état connu. Le suivi détaillé des
          collectes prévu dans les tickets suivants est une extension distincte,
          à spécifier avant de l'ajouter, pas une sixième table implicite dans EXPL-02.
        size: S
        priority: P1
        dependsOn: []
        acceptance:
          - L'équipe distingue année demandée pour la collecte, date de sortie, année générée depuis cette date et horodatage de collecte.
          - Les exemples couvrent une date valide, une date absente et une date inexploitable ; aucune année de remplacement n'est inventée.
          - Le MCD attendu est reformulé avec les cardinalités film-genre et film-pays, sans nouvelle décision de modèle.
          - Un exemple de film avec plusieurs genres et deux pays illustre les cinq tables et les clés de liaison.
          - Un exemple sans durée, budget, recette ni votes explicite les NULL et les exclusions des calculs.
          - Les critères d'EXPL-02 sont traçables à cette spécification ; la limite par année et la couverture non exhaustive sont explicites.
      - id: EXPL-02
        type: feature
        title: Mettre en place le schéma SQLite à partir de la spécification
        story: |
          En tant que développeur, je veux traduire la spécification EXPL-01 en
          schéma SQLite pour stocker les films, leurs genres et leurs pays sans doublons.

          Le livrable est une définition SQL versionnée, accompagnée du diagramme
          relationnel et de tests sur une base temporaire. Il ne s'agit pas de choisir
          un autre moteur ou de redéfinir les données : EXPL-01 constitue le cahier
          des charges. EXPL-03 prendra ensuite en charge l'initialisation locale
          et la procédure d'installation.
        size: M
        priority: P1
        dependsOn: [EXPL-01]
        acceptance:
          - Les cinq tables movies, genres, countries, movie_genres et production_countries reprennent tous les attributs, types et nullabilités d'EXPL-01.
          - "movies.release_year est une colonne INTEGER GENERATED ALWAYS AS (CAST(strftime('%Y', release_date) AS INTEGER)) STORED, nullable et non renseignée par les écritures."
          - Un test insère un film daté de 2020, vérifie release_year = 2020, modifie release_date vers 2021 et vérifie le recalcul automatique.
          - Des tests vérifient release_year IS NULL pour une date NULL ou inexploitable, et le refus d'une insertion ou modification explicite de release_year.
          - movies.id, genres.id et countries.code sont les clés primaires ; les deux tables de liaison utilisent les clés primaires composées spécifiées.
          - Les clés étrangères sont activées sur chaque connexion de test ; un lien vers une référence absente et une association en double sont refusés.
          - Les références au film utilisent ON DELETE CASCADE ; supprimer un film retire ses liaisons mais conserve les genres et pays de référence.
          - Les contraintes CHECK imposent runtime_minutes > 0, budget > 0 et revenue > 0 lorsqu'ils sont renseignés, tout en autorisant NULL.
          - Les index movies_release_year sur movies.release_year et movie_genres_genre_id sur movie_genres.genre_id sont créés.
          - Des tests SQL sur base temporaire couvrent film multigenre et coproduction, valeurs NULL, note zéro avec votes, doublons, références absentes, valeurs positives et suppression en cascade.
          - Un diagramme relationnel et une requête de comptage par année et genre documentent le schéma ; aucune table d'historique ou d'exécutions n'est ajoutée dans ce ticket.
      - id: EXPL-03
        type: feature
        title: Créer et initialiser la base de données locale
        story: En tant qu'étudiant, je veux initialiser la base avec une commande documentée pour pouvoir travailler depuis un clone du projet.
        size: M
        priority: P1
        dependsOn: [EXPL-02]
        acceptance:
          - Des migrations versionnées créent les tables, contraintes et index du modèle.
          - Une commande documentée initialise une base vierge et sa réexécution ne supprime ni ne duplique les données.
          - La configuration de connexion est externalisée et les secrets ainsi que les fichiers locaux de base ne sont pas versionnés.
          - Un test sur une base temporaire vérifie les migrations et le refus des doublons.
      - id: EXPL-04
        type: feature
        title: Extraire les films TMDB sur une plage d'années
        story: En tant qu'analyste, je veux collecter les films de chaque année demandée sans me limiter aux films populaires de la page d'accueil.
        size: L
        priority: P1
        dependsOn: [EXPL-01]
        acceptance:
          - L'extraction utilise la recherche de catalogue TMDB par dates de sortie et parcourt la pagination pour chaque année demandée.
          - Les bornes d'années sont inclusives ; une date hors période est exclue et les films présents sur plusieurs pages sont dédupliqués par identifiant.
          - Les limites de pagination et de requêtes de TMDB ainsi que les plafonds choisis sont respectés et toute collecte tronquée est signalée.
          - Un HTTP 429 déclenche une attente bornée respectant Retry-After ; les erreurs persistantes sont explicites et ne produisent pas un succès apparent.
          - Des réponses TMDB simulées couvrent plusieurs pages, une année vide, un doublon, un HTTP 429 et une erreur persistante.
      - id: EXPL-05
        type: feature
        title: Nettoyer et contrôler les données collectées
        story: En tant qu'analyste, je veux des données validées et un bilan de qualité avant leur chargement.
        size: M
        priority: P1
        dependsOn: [EXPL-01, EXPL-04]
        acceptance:
          - Les types, dates, identifiants, genres et valeurs numériques sont contrôlés selon le dictionnaire.
          - Une note sans vote ne contribue pas aux statistiques de notes ; une valeur manquante n'est pas remplacée arbitrairement par zéro.
          - Les lignes rejetées sont comptées avec un motif explicite sans exposer le jeton TMDB.
          - Les transformations sont vérifiées sur des exemples valides, incomplets et invalides dont les résultats attendus sont connus.
      - id: EXPL-06
        type: feature
        title: Charger les données en base de façon idempotente
        story: En tant qu'analyste, je veux relancer une alimentation sans doublonner les films ni masquer une collecte incomplète.
        size: L
        priority: P1
        dependsOn: [EXPL-03, EXPL-05]
        acceptance:
          - Le chargement insère les nouveaux films, actualise les existants et synchronise leurs genres avec des transactions cohérentes.
          - Deux chargements du même jeu ne modifient pas les effectifs des films et associations.
          - Chaque exécution conserve son statut et ses compteurs insérés, actualisés, rejetés et collectés ainsi que son périmètre.
          - Une panne en cours d'alimentation est signalée comme échec ou exécution incomplète ; une relance ne double pas les données déjà chargées.
          - Un test sur base temporaire couvre deux chargements identiques, une mise à jour et une interruption.
      - id: EXPL-07
        type: feature
        title: Piloter l'alimentation avec un petit CLI
        story: En tant qu'étudiant, je veux lancer le pipeline depuis le terminal en choisissant les années sans modifier son code.
        size: M
        priority: P1
        dependsOn: [EXPL-06]
        acceptance:
          - Une commande npm expose une aide et des options de début, fin et limite par année avec un exemple pour 2015 à 2024.
          - Le CLI appelle le pipeline partagé d'extraction, validation et chargement sans dupliquer sa logique.
          - Les options invalides et une période inversée sont refusées avant tout appel TMDB ou écriture en base.
          - Un mode simulation affiché le périmètre et les limites sans appel réseau ni modification de la base.
          - Le terminal affiché les compteurs et la durée ; un échec renvoie un code non nul et n'affiché aucun secret.
      - id: EXPL-08
        type: feature
        title: Exposer les données et indicateurs d'exploration dans l'API
        story: En tant que visiteur, je veux explorer les données stockées sans déclencher de nouvelle collecte TMDB.
        size: L
        priority: P2
        dependsOn: [EXPL-06]
        acceptance:
          - Des routes documentées lisent uniquement la base et acceptent période inclusive, genre et pagination valides.
          - L'API fournit liste de films et agrégats par année avec effectif, nombre de films notés, moyenne et médiane des notes valides.
          - Les filtres s'appliquent à tout le périmètre en base avant agrégation ou pagination, pas seulement à la page courante.
          - Le comptage des films reste unique lorsqu'un film possède plusieurs genres ; la pondération éventuelle par nombre de votes est distinguée de la moyenne simple.
          - Les réponses précisent date et périmètre de collecte, années manquantes et couverture partielle ; une base vide a une réponse explicite.
          - Un jeu de données connu vérifie les calculs, filtres, valeurs manquantes et erreurs de paramètres.
      - id: EXPL-09
        type: feature
        title: Créer la page d'exploration et ses filtres
        story: En tant que visiteur, je veux choisir une plage d'années et un genre puis consulter les films correspondants.
        size: M
        priority: P2
        dependsOn: [EXPL-08]
        acceptance:
          - Une page Tableau de bord est accessible depuis la navigation sans modifier la liste existante des films populaires.
          - Les années de début et fin et le genre sont conservés dans l'URL et restaurés au rechargement.
          - Le tableau paginé affiché titre, année, genres, note et nombre de votes avec un lien vers la fiche du film.
          - Chargement, base vide, aucun résultat et erreur sont distingués ; une erreur permet de réessayer et une réponse obsolète ne remplace pas la dernière sélection.
          - Les filtres sont utilisables au clavier avec des libellés explicites.
      - id: EXPL-10
        type: feature
        title: Visualiser et comparer les années du catalogue
        story: En tant qu'analyste, je veux comparer distributions et indicateurs entre années sans confondre absence de données et valeur nulle.
        size: L
        priority: P2
        dependsOn: [EXPL-09]
        acceptance:
          - La page affiché effectif et moyenne ou médiane des notes ainsi que des graphiques de répartition par année et par genre pour les filtres actifs.
          - Les titres, axes, unités, effectifs et règles de calcul sont visibles ; une alternative tabulaire restitue les valeurs.
          - Les années sans collecte sont distinguées des années collectées sans résultat et aucune interpolation n'invente de valeur.
          - La date de collecte et les limites de couverture sont affichees ; la page ne présente pas la popularité actuelle comme une mesure historique.
          - Les résultats affiches correspondent aux valeurs attendues du jeu de démonstration et restent lisibles sur mobile.
      - id: EXPL-11
        type: feature
        title: Livrer un parcours reproductible de la base au tableau de bord
        story: En tant qu'étudiant ou enseignant, je veux démontrer le parcours complet sans dépendance à un jeton TMDB réel.
        size: M
        priority: P2
        dependsOn: [EXPL-07, EXPL-10]
        acceptance:
          - Un petit jeu synthétique documenté couvre plusieurs années, plusieurs genres, une valeur manquante et une année sans données.
          - Une procédure depuis un clone explique installation, initialisation, alimentation de démonstration, lancement et consultation du tableau de bord.
          - Un test d'intégration automatisé initialise une base temporaire, charge le jeu deux fois et vérifie les indicateurs et le filtrage sans appel TMDB.
          - La vérification continue exécute les tests sans secret et les commandes échouent explicitement si la configuration est invalide.
          - La démonstration et la documentation permettent de distinguer données synthétiques, données collectées et limites de l'analyse.
