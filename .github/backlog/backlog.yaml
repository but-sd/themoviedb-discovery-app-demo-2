  viewName: Backlog
  typeViews:
    - name: Features
      type: feature
    - name: Bugs
      type: bug
  stages:
    - Backlog
    - Ready
    - In Progress
    - In Review
    - Done
sizes:
  - name: XS
    weight: 1
    color: GREEN
  - name: S
    weight: 2
    color: BLUE
  - name: M
    weight: 3
    color: YELLOW
  - name: L
    weight: 5
    color: ORANGE
  - name: XL
    weight: 8
