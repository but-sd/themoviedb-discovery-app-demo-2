epics:
  - id: EXPL
    title: Tableau de bord d'exploration des films sur plusieurs annees
    objective: Construire une chaine de donnees reproductible, de la collecte TMDB au tableau de bord, pour comparer les films selon leur annee de sortie sur une periode configurable.
    tickets:
      - id: EXPL-01
        type: feature
        title: Definir le perimetre et le dictionnaire des donnees
        story: En tant qu'analyste, je veux connaitre le perimetre des films collectes pour interpreter correctement les comparaisons entre annees.
        size: S
        priority: P1
        dependsOn: []
        acceptance:
          - Le perimetre utilise l'annee de sortie des films et une periode inclusive configurable, avec 2015 a 2024 comme exemple reproductible.
          - Un dictionnaire decrit identifiant TMDB, titre, date de sortie, genres, langue originale, note moyenne, nombre de votes et popularite, avec types, unites et valeurs manquantes.
          - La source, la langue, la region, les regles d'inclusion, l'ordre de collecte et une eventuelle limite par annee sont documentes.
          - Le document precise que notes et popularite sont observees a la date de collecte et ne representent pas leurs valeurs historiques a la sortie des films.
          - Les limites de couverture de TMDB sont explicites ; un echantillon tronque ne doit pas etre presente comme exhaustif.
      - id: EXPL-02
        type: feature
        title: Concevoir le modele de la base d'exploration
        story: En tant que developpeur, je veux un modele de donnees coherent pour stocker les films et tracer leur collecte.
        size: M
        priority: P1
        dependsOn: [EXPL-01]
        acceptance:
          - Un schema relationnel decrit films, genres, associations film-genre et executions de collecte.
          - Les identifiants TMDB sont uniques et les contraintes empechent les doublons d'associations et les references invalides.
          - Les executions conservent periode, criteres, horodatages, statut et compteurs de collecte, y compris les limites appliquees.
          - Les valeurs absentes sont distinguees de zero et les champs necessaires aux filtres par annee et genre sont identifies.
          - Le moteur de base est choisi et justifie pour un usage local etudiant ; le modele est relu avant implementation.
      - id: EXPL-03
        type: feature
        title: Creer et initialiser la base de donnees locale
        story: En tant qu'etudiant, je veux initialiser la base avec une commande documentee pour pouvoir travailler depuis un clone du projet.
        size: M
        priority: P1
        dependsOn: [EXPL-02]
        acceptance:
          - Des migrations versionnees creent les tables, contraintes et index du modele.
          - Une commande documentee initialise une base vierge et sa reexecution ne supprime ni ne duplique les donnees.
          - La configuration de connexion est externalisee et les secrets ainsi que les fichiers locaux de base ne sont pas versionnes.
          - Un test sur une base temporaire verifie les migrations et le refus des doublons.
      - id: EXPL-04
        type: feature
        title: Extraire les films TMDB sur une plage d'annees
        story: En tant qu'analyste, je veux collecter les films de chaque annee demandee sans me limiter aux films populaires de la page d'accueil.
        size: L
        priority: P1
        dependsOn: [EXPL-01]
        acceptance:
          - L'extraction utilise la recherche de catalogue TMDB par dates de sortie et parcourt la pagination pour chaque annee demandee.
          - Les bornes d'annees sont inclusives ; une date hors periode est exclue et les films presents sur plusieurs pages sont dedupliques par identifiant.
          - Les limites de pagination et de requetes de TMDB ainsi que les plafonds choisis sont respectes et toute collecte tronquee est signalee.
          - Un HTTP 429 declenche une attente bornee respectant Retry-After ; les erreurs persistantes sont explicites et ne produisent pas un succes apparent.
          - Des reponses TMDB simulees couvrent plusieurs pages, une annee vide, un doublon, un HTTP 429 et une erreur persistante.
      - id: EXPL-05
        type: feature
        title: Nettoyer et controler les donnees collectees
        story: En tant qu'analyste, je veux des donnees validees et un bilan de qualite avant leur chargement.
        size: M
        priority: P1
        dependsOn: [EXPL-01, EXPL-04]
        acceptance:
          - Les types, dates, identifiants, genres et valeurs numeriques sont controles selon le dictionnaire.
          - Une note sans vote ne contribue pas aux statistiques de notes ; une valeur manquante n'est pas remplacee arbitrairement par zero.
          - Les lignes rejetees sont comptees avec un motif explicite sans exposer le jeton TMDB.
          - Les transformations sont verifiees sur des exemples valides, incomplets et invalides dont les resultats attendus sont connus.
      - id: EXPL-06
        type: feature
        title: Charger les donnees en base de facon idempotente
        story: En tant qu'analyste, je veux relancer une alimentation sans doublonner les films ni masquer une collecte incomplete.
        size: L
        priority: P1
        dependsOn: [EXPL-03, EXPL-05]
        acceptance:
          - Le chargement insere les nouveaux films, actualise les existants et synchronise leurs genres avec des transactions coherentes.
          - Deux chargements du meme jeu ne modifient pas les effectifs des films et associations.
          - Chaque execution conserve son statut et ses compteurs inseres, actualises, rejetes et collectes ainsi que son perimetre.
          - Une panne en cours d'alimentation est signalee comme echec ou execution incomplete ; une relance ne double pas les donnees deja chargees.
          - Un test sur base temporaire couvre deux chargements identiques, une mise a jour et une interruption.
      - id: EXPL-07
        type: feature
        title: Piloter l'alimentation avec un petit CLI
        story: En tant qu'etudiant, je veux lancer le pipeline depuis le terminal en choisissant les annees sans modifier son code.
        size: M
        priority: P1
        dependsOn: [EXPL-06]
        acceptance:
          - Une commande npm expose une aide et des options de debut, fin et limite par annee avec un exemple pour 2015 a 2024.
          - Le CLI appelle le pipeline partage d'extraction, validation et chargement sans dupliquer sa logique.
          - Les options invalides et une periode inversee sont refusees avant tout appel TMDB ou ecriture en base.
          - Un mode simulation affiche le perimetre et les limites sans appel reseau ni modification de la base.
          - Le terminal affiche les compteurs et la duree ; un echec renvoie un code non nul et n'affiche aucun secret.
      - id: EXPL-08
        type: feature
        title: Exposer les donnees et indicateurs d'exploration dans l'API
        story: En tant que visiteur, je veux explorer les donnees stockees sans declencher de nouvelle collecte TMDB.
        size: L
        priority: P2
        dependsOn: [EXPL-06]
        acceptance:
          - Des routes documentees lisent uniquement la base et acceptent periode inclusive, genre et pagination valides.
          - L'API fournit liste de films et agregats par annee avec effectif, nombre de films notes, moyenne et mediane des notes valides.
          - Les filtres s'appliquent a tout le perimetre en base avant aggregation ou pagination, pas seulement a la page courante.
          - Le comptage des films reste unique lorsqu'un film possede plusieurs genres ; la ponderation eventuelle par nombre de votes est distinguee de la moyenne simple.
          - Les reponses precisent date et perimetre de collecte, annees manquantes et couverture partielle ; une base vide a une reponse explicite.
          - Un jeu de donnees connu verifie les calculs, filtres, valeurs manquantes et erreurs de parametres.
      - id: EXPL-09
        type: feature
        title: Creer la page d'exploration et ses filtres
        story: En tant que visiteur, je veux choisir une plage d'annees et un genre puis consulter les films correspondants.
        size: M
        priority: P2
        dependsOn: [EXPL-08]
        acceptance:
          - Une page Tableau de bord est accessible depuis la navigation sans modifier la liste existante des films populaires.
          - Les annees de debut et fin et le genre sont conserves dans l'URL et restaures au rechargement.
          - Le tableau pagine affiche titre, annee, genres, note et nombre de votes avec un lien vers la fiche du film.
          - Chargement, base vide, aucun resultat et erreur sont distingues ; une erreur permet de reessayer et une reponse obsolete ne remplace pas la derniere selection.
          - Les filtres sont utilisables au clavier avec des libelles explicites.
      - id: EXPL-10
        type: feature
        title: Visualiser et comparer les annees du catalogue
        story: En tant qu'analyste, je veux comparer distributions et indicateurs entre annees sans confondre absence de donnees et valeur nulle.
        size: L
        priority: P2
        dependsOn: [EXPL-09]
        acceptance:
          - La page affiche effectif et moyenne ou mediane des notes ainsi que des graphiques de repartition par annee et par genre pour les filtres actifs.
          - Les titres, axes, unites, effectifs et regles de calcul sont visibles ; une alternative tabulaire restitue les valeurs.
          - Les annees sans collecte sont distinguees des annees collectees sans resultat et aucune interpolation n'invente de valeur.
          - La date de collecte et les limites de couverture sont affichees ; la page ne presente pas la popularite actuelle comme une mesure historique.
          - Les resultats affiches correspondent aux valeurs attendues du jeu de demonstration et restent lisibles sur mobile.
      - id: EXPL-11
        type: feature
        title: Livrer un parcours reproductible de la base au tableau de bord
        story: En tant qu'etudiant ou enseignant, je veux demontrer le parcours complet sans dependance a un jeton TMDB reel.
        size: M
        priority: P2
        dependsOn: [EXPL-07, EXPL-10]
        acceptance:
          - Un petit jeu synthetique documente couvre plusieurs annees, plusieurs genres, une valeur manquante et une annee sans donnees.
          - Une procedure depuis un clone explique installation, initialisation, alimentation de demonstration, lancement et consultation du tableau de bord.
          - Un test d'integration automatise initialise une base temporaire, charge le jeu deux fois et verifie les indicateurs et le filtrage sans appel TMDB.
          - La verification continue execute les tests sans secret et les commandes echouent explicitement si la configuration est invalide.
          - La demonstration et la documentation permettent de distinguer donnees synthetiques, donnees collectees et limites de l'analyse.
